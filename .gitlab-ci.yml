stages:
  - test
  - build
  - deploy

variables:
  FLUTTER_VERSION: "3.19.5"  # Укажите нужную версию Flutter

# Кэширование для ускорения сборок
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .flutter/
    - .pub-cache/
    - build/

before_script:
  - export PATH="$PATH:/usr/lib/flutter/bin"
  - flutter --version
  - flutter doctor

# Установка Flutter
.setup_flutter: &setup_flutter
  before_script:
    - apt-get update -q -y
    - apt-get install -q -y curl unzip libglu1-mesa
    - |
      if [ ! -d "/usr/lib/flutter" ]; then
        curl -L https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz -o flutter.tar.xz
        tar xf flutter.tar.xz -C /usr/lib/
        mv /usr/lib/flutter /usr/lib/flutter_sdk
        ln -s /usr/lib/flutter_sdk /usr/lib/flutter
      fi
    - export PATH="$PATH:/usr/lib/flutter/bin"
    - flutter config --no-analytics
    - flutter precache
    - flutter doctor

# Тестирование
test:
  stage: test
  extends: .setup_flutter
  script:
    - flutter pub get
    - flutter test
    - flutter analyze
  artifacts:
    when: always
    reports:
      junit: test-results.xml
    paths:
      - coverage/

# Сборка для Android
build_android:
  stage: build
  extends: .setup_flutter
  script:
    - flutter pub get
    - flutter build apk --release --split-per-abi
    - flutter build appbundle --release
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/
      - build/app/outputs/bundle/
    expire_in: 1 week
  only:
    - tags
    - main
    - master

# Сборка для iOS (требуется macOS runner)
build_ios:
  stage: build
  extends: .setup_flutter
  script:
    - flutter pub get
    - flutter build ipa --release --export-options-plist="ios/ExportOptions.plist"
  artifacts:
    paths:
      - build/ios/ipa/
    expire_in: 1 week
  only:
    - tags
    - main
    - master
  tags:
    - macos  # Требуется macOS runner

# Сборка для Web
build_web:
  stage: build
  extends: .setup_flutter
  script:
    - flutter pub get
    - flutter build web --release
  artifacts:
    paths:
      - build/web/
    expire_in: 1 week
  only:
    - tags
    - main
    - master

# Деплой на Firebase Hosting (для web)
deploy_web_firebase:
  stage: deploy
  extends: .setup_flutter
  script:
    - flutter pub get
    - flutter build web --release
    - |
      if [ -f "firebase.json" ]; then
        npm install -g firebase-tools
        firebase deploy --token=$FIREBASE_TOKEN --project=$FIREBASE_PROJECT_ID
      fi
  only:
    - main
    - master
  environment:
    name: production
    url: https://your-app.web.app
  variables:
    FIREBASE_TOKEN: $FIREBASE_DEPLOY_TOKEN
    FIREBASE_PROJECT_ID: $FIREBASE_PROJECT_ID

# Деплой в Google Play (требуется дополнительная настройка)
deploy_android:
  stage: deploy
  extends: .setup_flutter
  script:
    - flutter build appbundle --release
    - |
      # Здесь можно добавить скрипт для загрузки в Google Play
      # например, с помощью fastlane или gradle
      echo "Deploy to Google Play would happen here"
  only:
    - tags
  when: manual

# Линтинг и проверка кода
lint:
  stage: test
  extends: .setup_flutter
  script:
    - flutter pub get
    - flutter analyze
    - dart format --set-exit-if-changed .
  only:
    - merge_requests

# Генерация документации
generate_docs:
  stage: test
  extends: .setup_flutter
  script:
    - flutter pub get
    - dart doc .
  artifacts:
    paths:
      - doc/api/
    expire_in: 1 week
  only:
    - tags